<!doctype html>
<html lang="en" data-theme="silk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prompt Pilot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-base-200 text-base-content">
    <main class="mx-auto flex min-h-screen w-full max-w-2xl flex-col gap-3 p-3 sm:p-4">
      <header class="flex items-center justify-between gap-3 px-1 pt-1">
        <div>
          <p class="text-xs font-semibold uppercase tracking-widest opacity-55">Bulk AI runner</p>
          <h1 class="text-xl font-bold tracking-tight">Prompt Pilot</h1>
        </div>
        <span id="siteBadge" class="badge badge-soft badge-sm">Checking tab…</span>
      </header>

      <section class="card card-border bg-base-100 shadow-sm">
        <div class="card-body gap-3 p-4">
          <div class="flex items-center justify-between gap-3">
            <label for="prompts" class="font-semibold">Prompt queue</label>
            <span id="countBadge" class="badge badge-ghost badge-sm">0 prompts</span>
          </div>
          <textarea id="prompts" class="textarea h-56 w-full resize-y font-mono text-sm leading-relaxed" placeholder="Paste prompts here…&#10;&#10;Separate prompts with a blank line, or choose one prompt per line below."></textarea>
          <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
            <label class="form-control">
              <span class="label pb-1 text-xs font-medium opacity-70">Split prompts by</span>
              <select id="separator" class="select select-sm w-full">
                <option value="blank">Blank line</option>
                <option value="line">Every line</option>
                <option value="delimiter">--- separator</option>
              </select>
            </label>
            <label class="form-control">
              <span class="label pb-1 text-xs font-medium opacity-70">Delay between sends</span>
              <select id="delay" class="select select-sm w-full">
                <option value="3">3 seconds</option>
                <option value="5" selected>5 seconds</option>
                <option value="10">10 seconds</option>
                <option value="20">20 seconds</option>
                <option value="30">30 seconds</option>
              </select>
            </label>
          </div>
          <label class="flex cursor-pointer items-center justify-between gap-3 rounded-box bg-base-200 px-3 py-2.5">
            <span>
              <span class="block text-sm font-medium">Press send automatically</span>
              <span class="block text-xs opacity-60">Turn off to paste each prompt without submitting</span>
            </span>
            <input id="autoSend" type="checkbox" class="toggle toggle-sm" checked />
          </label>
        </div>
      </section>

      <section class="card card-border bg-base-100 shadow-sm">
        <div class="card-body gap-3 p-4">
          <div class="flex items-center justify-between gap-3">
            <div>
              <h2 class="font-semibold">Run status</h2>
              <p id="statusText" class="text-xs opacity-60">Ready to send</p>
            </div>
            <span id="progressLabel" class="font-mono text-xs opacity-60">0 / 0</span>
          </div>
          <progress id="progress" class="progress w-full" value="0" max="1"></progress>
          <div id="notice" role="alert" class="alert alert-soft hidden py-2.5 text-sm"></div>
          <div class="card-actions grid grid-cols-2 gap-2 pt-1">
            <button id="startBtn" class="btn btn-primary btn-sm">Start queue</button>
            <button id="stopBtn" class="btn btn-sm" disabled>Stop</button>
          </div>
        </div>
      </section>

      <section class="rounded-box border border-base-300 bg-base-100 p-3 text-xs leading-relaxed opacity-70">
        Keep the AI tab active while the queue runs. Review AI-site terms before automating high-volume prompts.
      </section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
